; ---------------------------------------------------------------------------
; Application PHP limits.
;
; The stock php:8.3-apache defaults are too small for this application's
; synchronous, image-heavy work, and they contradict limits the app itself
; advertises:
;
;   memory_limit=128M        A bulk ZIP decodes up to CARS_BULK_DOWNLOAD_MAX_IMAGES
;                            (default 100) images through GD, one at a time. A
;                            single 3000x2000 truecolor image is ~24MB in GD
;                            alone. 128M also crashed the test suite outright
;                            ("Premature end of PHP process") once Filament 5
;                            raised the baseline footprint.
;
;   upload_max_filesize=2M   The CSV upload form advertises maxSize(5 * 1024),
;                            i.e. 5MB. PHP rejected anything over 2MB before
;                            Laravel ever saw the request.
;
;   max_execution_time=30    CARS_BULK_RUN_MAX_SECONDS defaults to 50, so the
;                            app's own pacing cap could never be reached — the
;                            web server killed the request first.
;
; These values give the application's own caps room to be the real limit.
; ---------------------------------------------------------------------------

memory_limit = 512M

upload_max_filesize = 16M
post_max_size = 20M

max_execution_time = 120
max_input_time = 120
