; Development OPcache settings.
;
; The default revalidate_freq of 2s means OPcache only re-checks a
; file's timestamp every 2 seconds, which can serve stale bytecode
; during rapid edit/refresh cycles. revalidate_freq=0 makes OPcache
; re-stat source files on every request so edits are picked up
; immediately — appropriate for a local dev container.
;
; Mounted into the container via docker-compose.yml; never shipped to
; SiteGround (production tunes these differently).
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
