name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys touch the server at once. A queued run waits for the
# one in flight rather than interleaving composer installs and migrations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the real floor: Filament pulls openspout, which requires
        # ~8.3.0+, and Laravel 13 requires ^8.3.
        php: ['8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd  -> ImageResizer, zip -> BatchZipBuilder, intl -> filament/support,
          # pdo_sqlite -> the test database defined in phpunit.xml.
          extensions: gd, zip, intl, pdo_sqlite, mbstring, exif, bcmath
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Confirm every declared platform requirement is met
        run: composer check-platform-reqs

      - name: Prepare environment
        # The suite mints its own APP_KEY (see tests/bootstrap.php), so no
        # secret is needed. The .env still gets created because Laravel's
        # Dotenv emits a PHP warning when booting without one.
        run: cp .env.example .env

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Audit dependencies for known vulnerabilities
        # Packagist's advisory API 502s from time to time, which fails this step
        # with a TransportException even though the lock file is fine. Retry the
        # blip, then fall back to --ignore-unreachable, which suppresses only an
        # unreachable advisory endpoint - a real advisory still exits non-zero
        # and still fails the job, so the gate keeps its teeth.
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            if output="$(composer audit 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"

            # Anything that is not a download failure is a genuine result
            # (advisories found, or a malformed lock file). Fail immediately
            # rather than burning retries on it.
            if ! printf '%s\n' "$output" | grep -q 'could not be downloaded'; then
              exit 1
            fi

            echo "::warning::Advisory endpoint unreachable (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo "::warning::Packagist advisory API still unreachable; re-running with --ignore-unreachable."
          composer audit --ignore-unreachable

  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to diff the push range.
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A manual run is deliberate: deploy whatever the paths say.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Not a push event - treating as deployable."
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch or a force-push reports an all-zero (or unreachable)
          # base SHA. Deploy rather than silently skip: a missed deploy is a
          # worse failure than a redundant one.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit - treating as deployable."
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$SHA")"
          echo "Changed files:"
          echo "$changed"

          # Deployable if ANY changed path is not documentation. grep -v exits 0
          # when at least one line fails to match the docs pattern.
          if printf '%s\n' "$changed" | grep -qvE '\.md$|^docs/'; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "-> code changed; the deploy will run."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation only; tests run, deploy is skipped."
          fi

  deploy:
    name: Deploy to SiteGround
    runs-on: ubuntu-latest
    needs: [test, changes]

    # Deploys only from main, never from a pull request, only once the
    # repository variable DEPLOY_ENABLED is 'true', and only when the push
    # actually touched something other than documentation. There is no reason
    # to cycle production through maintenance mode for a changelog entry.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true' &&
      needs.changes.outputs.deployable == 'true'

    # Attach a GitHub Environment so you can require a manual approval or
    # restrict which branches may deploy: Settings -> Environments -> production.
    environment: production

    steps:
      - name: Open an SSH session to SiteGround
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key rather than disabling host verification, so a
          # hijacked DNS record cannot silently receive the deploy key.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # SiteGround's default `php` on the CLI is often an older build than
          # the one serving the site. Set these repository variables if you
          # need a specific binary, e.g. PHP_BIN=/usr/local/php83/bin/php
          PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
          COMPOSER_BIN: ${{ vars.COMPOSER_BIN || 'composer' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "$SSH_PORT"
            # Be explicit rather than relying on defaults: StrictHostKeyChecking
            # defaults to "ask", and BatchMode stops any prompt hanging the job
            # until the workflow times out.
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o BatchMode=yes
            -o ConnectTimeout=20
          )

          # Preflight: the deploy script needs bash (it uses `set -o pipefail`
          # and a trap). Without this check a bash-less host fails with a bare
          # `sh: bash: not found` and exit 127, which is a confusing way to
          # learn that. Verified against a real sshd during development.
          if ! ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'command -v bash >/dev/null'; then
            echo "::error::No bash on the remote host. The deploy script requires it."
            exit 1
          fi

          # SC2029: the expansion below is deliberate. These three values must be
          # interpolated on the runner so they arrive as literals in the remote
          # command; the remote has no way to know them otherwise.
          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "PHP_BIN='$PHP_BIN' COMPOSER_BIN='$COMPOSER_BIN' DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail

          # DEPLOY_PATH arrives single-quoted, so the remote shell performs no
          # tilde expansion: a value like ~/www/site/public_html would reach
          # `cd` as a literal and abort the deploy. Expand it here so both
          # absolute and ~-relative values work.
          DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"

          cd "$DEPLOY_PATH"

          # Fail loudly if DEPLOY_PATH is not actually a Laravel project root.
          # Without this the deploy proceeds into `git reset --hard` on whatever
          # directory it landed in, which is a bad way to discover a typo.
          if [ ! -f artisan ]; then
            echo "::error::No artisan found in $DEPLOY_PATH - is this the Laravel project root?"
            exit 1
          fi

          echo "==> Deploying $(pwd) as $(whoami)"
          "$PHP_BIN" -v | head -1

          # Bring the site down, but always bring it back up (see the trap).
          # Without this a failed migration would leave the panel offline.
          trap '"$PHP_BIN" artisan up || true' EXIT
          "$PHP_BIN" artisan down --retry=15 || true

          echo "==> Fetching code"
          git fetch --all --prune
          # reset --hard rather than pull: the repo previously tracked Filament's
          # compiled assets, and any leftover local modification would turn a
          # deploy into a merge conflict. Nothing on the server is authored by
          # hand -- .env and storage/ are untracked and are not touched by this.
          git reset --hard origin/main

          echo "==> Installing dependencies"
          "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --prefer-dist

          echo "==> Running migrations"
          "$PHP_BIN" artisan migrate --force

          echo "==> Publishing Filament assets"
          "$PHP_BIN" artisan filament:upgrade

          echo "==> Rebuilding caches"
          "$PHP_BIN" artisan config:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan route:cache
          "$PHP_BIN" artisan view:cache

          # Boot the framework with the freshly cached config, on the server,
          # before trusting anything the public URL says. This is the real
          # post-upgrade failure mode - a stale or broken config/route cache, or
          # a class that no longer exists - and unlike an HTTP probe it cannot
          # be masked or challenged by the edge.
          echo "==> Verifying the application boots"
          "$PHP_BIN" artisan about --only=environment

          echo "==> Ensuring the storage symlink exists"
          "$PHP_BIN" artisan storage:link || true

          echo "==> Deploy complete"
          REMOTE

      - name: Smoke check the deployed site
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL secret not set - skipping smoke check."
            exit 0
          fi
          url="${APP_URL%/}/admin/login"

          # A deploy that leaves the panel 500ing should fail the run, not
          # report success. /admin/login is the cheapest page that proves the
          # framework booted and Filament's assets resolved.
          #
          # Retry rather than probe once: this runs seconds after `artisan up`,
          # while opcache is cold and the config cache has just been rebuilt,
          # and shared hosting can briefly serve a stale 503 from its own cache.
          # A single-shot check turns that blip into a red deploy - a false
          # negative that teaches you to distrust the signal.
          for attempt in 1 2 3 4 5 6; do
            # No custom User-Agent: SiteGround's WAF answers 403 to unusual
            # agent strings (verified - a "Mozilla/5.0 (compatible; ...)" value
            # returned 403 on every attempt while curl's default returned 200).
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "attempt ${attempt}/6: GET $url -> $code"

            if [ "$code" = "200" ]; then
              echo "Smoke check passed."
              exit 0
            fi

            # 202 is SiteGround's bot protection challenging the runner, not the
            # application answering. A previous run failed on exactly this while
            # the deploy had in fact succeeded. It still proves the site is
            # reachable and not erroring, and `artisan about` has already
            # confirmed the app boots on the server, so treat it as a pass and
            # say so rather than reporting a healthy deploy as broken.
            if [ "$code" = "202" ]; then
              echo "::notice::Edge returned 202 (bot-protection challenge), not the application. Site is reachable; app health was confirmed on the server by 'artisan about'."
              exit 0
            fi

            [ "$attempt" -lt 6 ] && sleep 10
          done

          echo "::error::Site never returned 200 or 202 (6 attempts over ~60s). The deploy landed, but the site is not serving - check storage/logs/laravel.log."
          exit 1
